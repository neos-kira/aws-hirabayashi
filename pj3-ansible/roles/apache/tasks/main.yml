- name: Install Apache
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Enable and start httpd
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: yes

- name: Create document root directory
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy index.html
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: |
      <html>
      <head><title>NeOS PJ3</title></head>
      <body>
      <h1>NeOS AWS 擬似プロジェクト③</h1>
      <p>このページは Ansible によって自動配置されました。</p>
      </body>
      </html>
    owner: root
    group: root
    mode: "0644"
