- name: Install chrony
  ansible.builtin.dnf:
    name: chrony
    state: present

- name: Configure chrony for Amazon Time Sync Service
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chronyd

- name: Enable and start chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: yes
